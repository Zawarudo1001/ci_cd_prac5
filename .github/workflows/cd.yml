name: Deploy to Render

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Run basic health check
        run: |
          # Простая проверка, что server.js валидный
          node -c server.js
          echo "Server code is valid"

  build_push_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build Docker image
        run: docker build -t myapp:latest .

      - name: Tag image for Docker Hub
        run: docker tag myapp:latest ${{ secrets.DOCKER_USERNAME }}/repo:prac5

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/repo:prac5
      
      - name: Trigger deploy hook
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DEPLOY_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$DEPLOY_URL" ]; then
            echo "Triggering deployment on Render..."
            curl -X POST "$DEPLOY_URL"
            echo "Deploy triggered successfully"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set, skipping deploy"
          fi

